<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Experiment 3 - Simulator 1</title>

    <style>
        a {
            text-decoration: none;
        }
        .text {
            background-color: yellow;
            border-radius: 21px;
            font-size: 22px;
            margin-left: 50px;
            margin-right: 50px;
            padding: 5px;
        }
        .btn-outline-success {
            width: 100%;
            font-size: 20px;
            margin: 3px 0;
        }
        .selected {
            background-color: #198754 !important;
            color: white;
        }
        #result {
            display: none;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 18px;
            margin: 5px;
            background-color: lightpink;
            min-height: unset;
            height: auto;
            padding: 4px 10px;
            border-radius: 6px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }
        .sample-list {
            list-style: none;
            padding: 0;
        }
        .sample-item {
            padding: 12px 18px;
            margin-bottom: 8px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 500;
            background: #eaf6ff;
            color: #0d2b56;
            border: 2px solid #eaf6ff;
            transition: background 0.2s, border 0.2s;
        }
        .sample-item.active {
            background: #ffe066;
            border: 2px solid #ffb300;
            color: #b85c00;
            font-weight: bold;
        }
        .etchant-list {
            list-style: none;
            padding: 0;
        }
        .etchant-list li {
            margin-bottom: 10px;
        }
        .sim-title {
            color: red;
        }
        .sim-instruction {
            color: #8B4000;
        }
        @media (max-width: 767px) {
            .sample-item, .btn-outline-success {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <button type="button" class="btn btn-outline-info mx-2 my-2"><a href="index.html">Go to main page</a></button>
    <button type="button" class="btn btn-outline-info m-3"><a href="Simulator2_exp3.html">Next</a></button>
    
    <h2 class="d-flex justify-content-center align-items-center sim-title">Simulator 1</h2>
    <p class="d-flex justify-content-center align-items-center text sim-instruction">
        Choose the correct etchant for the highlighted sample
    </p>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 mb-3">
                <ul class="sample-list" id="sampleList">
                    <!-- Sample names will be rendered here -->
                </ul>
            </div>
            <div class="col-md-5 mb-3">
                <ul class="etchant-list" id="etchantOptions">
                    <!-- Etchant options will be rendered here -->
                </ul>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <p id="result"></p>
            </div>
        </div>
    </div>

    <script>
        // Data from the provided table
        const samples = [
            {
                name: 'Al₂O₃, Al₂O₃-MgO',
                correct: 'Thermal Etching in Air'
            },
            {
                name: 'ZrO₂',
                correct: 'DI-H₂O + H₂SO₄'
            },
            {
                name: 'SiC',
                correct: 'Molten salt (NaHCO₃, KHCO₃)'
            },
            {
                name: 'WC',
                correct: 'HCl or H₂O₂ (30%)'
            },
            {
                name: 'Si₃N₄',
                correct: 'Thermal Etching in High Purity Nitrogen'
            },
            {
                name: 'ZrB₂',
                correct: 'Nitric acid, HF'
            },
            {
                name: 'TiB₂',
                correct: 'Lactic acid (2-Hydroxypropanoic acid)'
            }
        ];

        // All possible etchant options
        const etchants = [
            'Thermal Etching in Air',
            'DI-H₂O + H₂SO₄',
            'Molten salt (NaHCO₃, KHCO₃)',
            'HCl or H₂O₂ (30%)',
            'Thermal Etching in High Purity Nitrogen',
            'Nitric acid, HF',
            'Lactic acid (2-Hydroxypropanoic acid)'
        ];

        let currentIndex = 0;
        const resultElement = document.getElementById('result');
        const sampleList = document.getElementById('sampleList');
        const etchantOptions = document.getElementById('etchantOptions');

        function renderSamples() {
            sampleList.innerHTML = '';
            samples.forEach((sample, idx) => {
                const li = document.createElement('li');
                li.className = 'sample-item' + (idx === currentIndex ? ' active' : '');
                li.textContent = sample.name;
                sampleList.appendChild(li);
            });
        }

        function shuffle(array) {
            // Fisher-Yates shuffle
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function renderEtchantOptions() {
            etchantOptions.innerHTML = '';
            // Shuffle a copy of the etchants array for each question
            const shuffledEtchants = shuffle([...etchants]);
            shuffledEtchants.forEach(option => {
                const li = document.createElement('li');
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'btn btn-outline-success';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(option);
                li.appendChild(btn);
                etchantOptions.appendChild(li);
            });
        }

        function checkAnswer(selected) {
            resultElement.style.display = 'flex';
            if (selected === samples[currentIndex].correct) {
                resultElement.textContent = 'Correct! Well done!';
                resultElement.style.backgroundColor = 'lightgreen';
                setTimeout(() => {
                    moveToNext();
                }, 1500);
            } else {
                resultElement.textContent = 'Incorrect. Try again!';
                resultElement.style.backgroundColor = 'lightpink';
            }
        }

        function moveToNext() {
            currentIndex++;
            if (currentIndex < samples.length) {
                renderSamples();
                renderEtchantOptions();
                resultElement.textContent = '';
                resultElement.style.display = 'none';
            } else {
                sampleList.innerHTML = '';
                etchantOptions.innerHTML = '';
                resultElement.textContent = "Congratulations! You've completed all samples!";
                resultElement.style.backgroundColor = 'lightgreen';
                resultElement.style.display = 'flex';
            }
        }

        // Initial render
        renderSamples();
        renderEtchantOptions();
        resultElement.style.display = 'none';
    </script>
</body>

</html>
