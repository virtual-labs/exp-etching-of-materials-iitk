<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Experiment 3 - Simulator 2</title>

    <style>
        a {
            text-decoration: none;
        }

        body {
            background: #f8f9fa;
        }

        .text {
            background-color: yellow;
            border-radius: 21px;
            font-size: 22px;
            margin-left: 50px;
            margin-right: 50px;
            padding: 5px;
        }

        .sim-title {
            color: red;
            text-align: center;
            margin-top: 24px;
            font-weight: bold;
        }

        .sim-instruction {
            color: #8B4000;
            background: yellow;
            border: none;
            border-radius: 10px;
            padding: 16px;
            margin: 24px auto 32px auto;
            text-align: center;
            font-size: 1.3rem;
            max-width: 900px;
            font-weight: 500;
        }

        .sequence-row {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .sample-box {
            width: 110px;
            height: 110px;
            background: #fff;
            border: 2px solid #333;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 10px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .arrow {
            font-size: 2.5rem;
            color: #1976d2;
            margin: 0 8px;
        }

        .drop-box {
            width: 140px;
            height: 70px;
            background: #e3f2fd;
            border: 2px dashed #1976d2;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 10px;
            font-size: 1.1rem;
            font-weight: 500;
            color: #1976d2;
        }

        .drop-box.filled {
            background: #c8e6c9;
            border: 2px solid #388e3c;
            color: #388e3c;
        }

        .draggable-option {
            display: inline-block;
            background: #1565c0;
            color: #fff;
            border-radius: 30px;
            padding: 12px 28px;
            margin: 10px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: grab;
            border: none;
            transition: background 0.2s;
            user-select: none;
        }

        .draggable-option:active {
            background: #1976d2;
        }

        #result {
            display: none;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 18px;
            margin: 10px auto;
            background-color: lightpink;
            min-height: unset;
            height: auto;
            padding: 4px 10px;
            border-radius: 6px;
            width: fit-content;
        }

        @media (max-width: 900px) {

            .sequence-row,
            .drop-row {
                flex-direction: column;
                align-items: stretch;
            }

            .sample-box,
            .drop-box {
                margin: 10px auto;
            }
        }
    </style>
</head>

<body>
    <button type="button" class="btn btn-outline-info mx-2 my-2"><a href="index.html"> Go to main page</a></button>
    <button type="button" class="btn btn-outline-info m-3"><a href="Simulator1_exp3.html">Back</a></button>
    <!-- <button type="button" class="btn btn-outline-info m-3"><a href="Simulator3_exp3.html">Next</a></button> -->
    <h2 class="d-flex justify-content-center align-items-center"> Simulator 2</h2>
    <p class="d-flex justify-content-center align-items-center text"> The simulator will be solved when all the steps
        are completely arranged in sequential order. Drag the steps into the boxes and put them in the correct sequence
        to solve the simulator. </p>


    <div class="container-fluid">
        <h2 id="title" class="d-flex justify-content-center align-items-center"> </h2>
        <div class="sequence-row mb-4 mt-4">
            <div class="sample-box" style="min-width:120px;">
                <span style="font-size:1.1rem;color:#d32f2f;">Ceramics<br>Bulk Sample</span>
            </div>
            <span class="arrow" id="arrow0">&#8594;</span>
            <div class="drop-box" id="drop0" ondrop="drop(event,0)" ondragover="allowDrop(event)"></div>
            <span class="arrow" id="arrow1">&#8594;</span>
            <div class="drop-box" id="drop1" ondrop="drop(event,1)" ondragover="allowDrop(event)"></div>
            <span class="arrow" id="arrow2">&#8594;</span>
            <div class="drop-box" id="drop2" ondrop="drop(event,2)" ondragover="allowDrop(event)"></div>
            <span class="arrow" id="arrow3">&#8594;</span>
            <div class="drop-box" id="drop3" ondrop="drop(event,3)" ondragover="allowDrop(event)"></div>
            <span class="arrow" id="arrow4">&#8594;</span>
            <div class="drop-box" id="drop4" ondrop="drop(event,4)" ondragover="allowDrop(event)"></div>
            <span class="arrow" id="arrow5">&#8594;</span>
            <div class="drop-box" id="drop5" ondrop="drop(event,5)" ondragover="allowDrop(event)"></div>
        </div>
        <div class="row mb-4">
            <div class="col-12 d-flex flex-wrap justify-content-center" id="optionsArea">
                <!-- Draggable options will be rendered here -->
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <div id="result"></div>
            </div>
        </div>
    </div>
    <script>
        // Common option list reused by every level
        const commonOptions = [
            'Polishing',
            'Gold Coating',
            'Microscopy',
            'Microscopy (SE mode)',
            'Microscopy (BSE mode)',
            'Fracturing',
            'Grinding',
            'Etching',
            'Sectioning',
            'Cleaning',
            'Mounting',
            'Interface',
            'Fractured surface',
            'Secondary Phases',
            'Porosity'
        ];
        // Define all levels (each with its own correct sequence)
        const levels = [
            {
                title: 'Interface morphology',
                correctSteps: [
                    'Sectioning',
                    'Mounting',
                    'Polishing',
                    'Gold Coating',
                    'Microscopy (SE mode)',
                    'Interface'
                ]
            },
            {
                title: 'Porosity measurement through microscopy',
                correctSteps: [
                    'Polishing',
                    'Etching',
                    'Gold Coating',
                    'Microscopy (SE mode)',
                    'Porosity'
                ]
            },
            {
                title: 'Fracture surface morphology',
                correctSteps: [
                    'Fracturing',
                    'Etching',
                    'Gold Coating',
                    'Microscopy',
                    'Fractured surface'
                ]
            },
            {
                title: 'Identify secondary phases',
                correctSteps: [
                    'Grinding',
                    'Polishing',
                    'Etching',
                    'Microscopy (BSE mode)',
                    'Secondary Phases'
                ]
            }
        ];
        let currentLevel = 0;
        let correctSteps = levels[currentLevel].correctSteps;
        // Utility: shuffle the common options for display variety
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
        let options = shuffle([...commonOptions]);
        let dropped = Array(correctSteps.length).fill(null);
        function renderOptions() {
            const area = document.getElementById('optionsArea');
            area.innerHTML = '';
            options.forEach((opt, idx) => {
                if (!dropped.includes(opt)) {
                    const btn = document.createElement('div');
                    btn.className = 'draggable-option';
                    btn.textContent = opt;
                    btn.draggable = true;
                    btn.id = 'opt-' + idx;
                    btn.ondragstart = (e) => drag(e, opt);
                    area.appendChild(btn);
                }
            });
        }
        function allowDrop(ev) {
            ev.preventDefault();
        }
        function drag(ev, value) {
            ev.dataTransfer.setData('text', value);
        }
        function drop(ev, idx) {
            ev.preventDefault();
            if (idx >= correctSteps.length) return;
            const value = ev.dataTransfer.getData('text');
            if (dropped[idx] === null && !dropped.includes(value)) {
                dropped[idx] = value;
                const box = document.getElementById('drop' + idx);
                box.textContent = value;
                box.classList.add('filled');
                renderOptions();
                checkCompletion();
            }
        }
        function checkCompletion() 
        {
            const result = document.getElementById('result');

            if (dropped.every(x => x !== null)) {

                let hasError = false;

                for (let i = 0; i < correctSteps.length; i++) {
                    const box = document.getElementById('drop' + i);

                    if (dropped[i] === correctSteps[i]) {
                        box.style.backgroundColor = '#c8e6c9'; // green
                        box.style.border = '2px solid #388e3c';
                    } else {
                        box.style.backgroundColor = '#ffcdd2'; // red
                        box.style.border = '2px solid #d32f2f';
                        hasError = true;
                    }
                }

                if (hasError) {
                    result.textContent = 'Some steps are incorrect. Resetting...';
                    result.style.backgroundColor = 'lightpink';
                    result.style.display = 'flex';

                    setTimeout(() => {
                        resetLevel();
                    }, 2000);

                } else {

                    if (currentLevel < levels.length - 1) {

                        result.textContent = 'Correct! Loading next step...';
                        result.style.backgroundColor = 'lightgreen';
                        result.style.display = 'flex';

                        setTimeout(() => {
                            loadNextLevel();
                        }, 1500);

                    } else {

                        result.textContent =
                            'Congratulations! All steps are correct and you completed all tasks!';
                        result.style.backgroundColor = 'lightgreen';
                        result.style.display = 'flex';
                    }
                }
            }
        }
        function loadNextLevel() {
            currentLevel++;
            correctSteps = levels[currentLevel].correctSteps;
            options = shuffle([...commonOptions]);
            dropped = Array(correctSteps.length).fill(null);
            // Update the title
            document.getElementById('title').textContent = levels[currentLevel].title;
            // Show/Hide drop boxes based on steps
            for (let i = 0; i < 6; i++) {
                const dropBox = document.getElementById('drop' + i);
                const arrow = document.getElementById('arrow' + i);
                if (i < correctSteps.length) {
                    dropBox.style.display = 'flex';
                    arrow.style.display = 'inline-block';
                } else {
                    dropBox.style.display = 'none';
                    arrow.style.display = 'none';
                }
                dropBox.textContent = '';
                dropBox.classList.remove('filled');
            }
            renderOptions();
            const result = document.getElementById('result');
            result.textContent = '';
            result.style.display = 'none';
        }
        function resetLevel() 
        {

            dropped = Array(correctSteps.length).fill(null);

            for (let i = 0; i < 6; i++) {

                const dropBox = document.getElementById('drop' + i);

                dropBox.textContent = '';
                dropBox.classList.remove('filled');

                dropBox.style.backgroundColor = '#e3f2fd';
                dropBox.style.border = '2px dashed #1976d2';
            }

            options = shuffle([...commonOptions]);
            renderOptions();

            const result = document.getElementById('result');
            result.textContent = '';
            result.style.display = 'none';
        }
        // Initial render
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('title').textContent = levels[0].title;
            // Adjust drop boxes visibility on first load
            for (let i = 0; i < 6; i++) {
                const dropBox = document.getElementById('drop' + i);
                const arrow = document.getElementById('arrow' + i);
                if (i < correctSteps.length) {
                    dropBox.style.display = 'flex';
                    arrow.style.display = 'inline-block';
                } else {
                    dropBox.style.display = 'none';
                    arrow.style.display = 'none';
                }
            }
        });
        renderOptions();
    </script>
</body>

</html>
